[project]
name = "chrome-bridge"
version = "1.0.3"
description = "Drive your real Chrome (with logins, cookies, SPA state) from Python or any agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shuyuan Shi" }]
keywords = [
  "agent-skill",
  "agentskills",
  "browser-automation",
  "chrome-extension",
  "scraping",
  "websocket",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/your-org/chrome-bridge"
Issues = "https://github.com/your-org/chrome-bridge/issues"
