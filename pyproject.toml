[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chrome-bridge-agent"
version = "2.2.0"
description = "Drive your real Chrome (with logins, cookies, SPA state) from Python or any agent."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shuyuan Shi" }]
keywords = [
  "agent-skill",
  "agentskills",
  "browser-automation",
  "chrome-extension",
  "scraping",
  "websocket",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "websockets>=12.0",
]

[project.scripts]
chrome-bridge = "bridge_client:main"
chrome-bridge-server = "bridge_server:main_cli"

[project.urls]
Homepage = "https://github.com/shuyuanshi/chrome-bridge-agent"
Issues = "https://github.com/shuyuanshi/chrome-bridge-agent/issues"

# scripts/ holds flat modules, not a package — map them to the wheel root
# so `import bridge_client` works both installed and via sys.path.
[tool.hatch.build.targets.wheel]
only-include = ["scripts"]
sources = ["scripts"]

[tool.hatch.build.targets.sdist]
include = [
  "agents",
  "scripts",
  "extension",
  "tests",
  "references",
  "examples",
  "SKILL.md",
  "README.md",
  "LICENSE",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
  "basedpyright>=1.13",
]

# ───────────────────────── tooling ─────────────────────────

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
]
ignore = [
  "E501",  # line length is owned by `ruff format`
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # allow `assert False` in tests

[tool.basedpyright]
include = ["scripts", "tests", "examples"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportUnusedImport = "warning"
# scripts/* import each other by sys.path, not as a package
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
  "integration: tests that require a live Chrome Bridge (server + extension + signed-in browser)",
]
addopts = [
  "-ra",
  "--strict-markers",
]
