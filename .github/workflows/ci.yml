name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here needs write access; a job that installs unpinned third-party
# code (see validate-skill) must not hold a writable token.
permissions:
  contents: read

# Cancel in-progress runs on the same branch when a newer commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (ruff + basedpyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dev dependencies
        run: uv sync --group dev --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: basedpyright
        run: uv run basedpyright

      - name: build (the wheel must import as flat modules)
        run: uv build

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dev dependencies
        run: uv sync --group dev --frozen --python ${{ matrix.python-version }}

      - name: pytest (skip integration — no Chrome in CI)
        run: uv run --python ${{ matrix.python-version }} pytest -m "not integration"

  validate-skill:
    name: skills-ref validate (agentskills.io spec)
    runs-on: ubuntu-latest
    # Installs an unpinned upstream HEAD, so a change there can fail this job
    # with no local repro. Advisory only — it must not gate a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Validate SKILL.md against agentskills.io spec
        run: |
          uvx --from "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref" \
            skills-ref validate "$GITHUB_WORKSPACE"
